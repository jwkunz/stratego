name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web tests and single-file build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the build is one self-contained file
        run: |
          test "$(ls dist | wc -l)" = 1
          ! grep -E '<script[^>]+src=|<link[^>]+href=' dist/index.html
      - run: cp dist/index.html "$RUNNER_TEMP/stratego.html"
      - uses: actions/upload-artifact@v4
        with:
          name: stratego-html
          path: ${{ runner.temp }}/stratego.html
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install web dependencies (Gradle runs the web build)
        run: npm ci
        working-directory: web
      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: Android
      - run: cp Android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/stratego-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: stratego-apk
          path: ${{ runner.temp }}/stratego-debug.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv artifacts/stratego.html "stratego-$TAG.html"
          mv artifacts/stratego-debug.apk "stratego-$TAG-debug.apk"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Stratego $TAG" --generate-notes \
            "stratego-$TAG.html#Stratego (single HTML file)" \
            "stratego-$TAG-debug.apk#Stratego (Android debug APK)"
